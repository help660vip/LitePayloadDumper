name: Build, test and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test with Go ${{ matrix.go }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.20.14", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Test application
        run: go test ./...
      - name: Test payload core
        working-directory: third_party/payload-dumper-go
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Win7
            go: "1.20.14"
            output: LitePayloadDumper_Win7.exe
          - name: Win10-11
            go: "stable"
            output: LitePayloadDumper_Win10-11.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build standalone EXE
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -buildvcs=false -ldflags "-s -w -H=windowsgui" -o "dist/${{ matrix.output }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath dist -Filter '*.exe' | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/LitePayloadDumper_Win7.exe
            dist/LitePayloadDumper_Win10-11.exe
            dist/SHA256SUMS.txt

